      <main class="bg-danger text-light w-75 m-auto border rounded-3">    
        <div class="row">   
            <section class="col-6">   
              <form class="m-5" id="carForm">
                <fieldset>
                    <legend>Orçamento de Carro</legend>
                    <div class="mb-3">
                        <label for="nome" class="form-label">Nome</label>
                        <input type="text" id="nome" class="form-control" placeholder="Digite seu nome" required>
                    </div>
                    <div class="mb-3">
                        <label for="telefone" class="form-label">Número do Cartão</label>
                        <input type="tel" id="telefone" class="form-control" placeholder="Digite seu número do cartão" pattern="[0-9]{13,19}" required>
                    </div>
                    <div class="mb-3">
                        <label for="number" class="form-label">Senha do Cartão</label>
                        <input type="password" id="number" class="form-control" placeholder="Digite sua senha" required>
                    </div>
                    
                    <button type="submit" class="btn btn-light text-danger">Enviar</button>
                </fieldset>
                <div id="alerta" class="alert alert-success alert-dismissible fade mt-3" role="alert" style="display: none;">
                    Formulário enviado com sucesso!
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            </form>
            
            </section>
    
            <section class="col-6 d-flex justify-content-center" id="img-car">  
                <img src="assets/img/img-car.svg" alt="">
